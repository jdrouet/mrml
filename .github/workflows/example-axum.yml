name: example-axum

on:
  merge_group:
    types: [checks_requested]
  workflow_call:
  pull_request:
    paths:
      - ".github/workflows/example-axum.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "examples/axum/**"
      - "packages/mrml-core/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/example-axum.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "examples/axum/**"
      - "packages/mrml-core/**"

env:
  RUSTFLAGS: "-Dwarnings"

jobs:
  testing:
    runs-on: ubuntu-latest

    concurrency:
      group: ${{ github.ref }}-example-axum
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: ./.github/actions/cargo-cache
        with:
          name: exampl-axum-testing

      - name: run tests
        run: cargo test -p axum-mrml
