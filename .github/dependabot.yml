version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      # Check for updates to GitHub Actions every week
      interval: "weekly"

  # Members inherit fields from the workspace manifest, so cargo must resolve from the root.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "daily"

  - package-ecosystem: "npm"
    directory: "/packages/mrml-wasm/examples/browser"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/packages/mrml-wasm/examples/node"
    schedule:
      interval: "weekly"
