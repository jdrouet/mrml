[package]
name = "mrml-wasm"
description = "Wasm wrapping on MRML"
keywords = ["email", "mjml"]
version = "1.6.2"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"

[lib]
name = "mrml_wasm"
crate-type = ["cdylib", "rlib"]

[features]
default = ["async", "reqwest-include-loader"]
async = ["dep:wasm-bindgen-futures", "mrml/async"]
reqwest-include-loader = ["async", "mrml/http-loader-async-reqwest"]

[dependencies]
mrml = { version = "7.0.0", path = "../mrml-core", default-features = false, features = [
    "parse",
    "render",
] }

serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = { version = "0.6" }

# to generate typescript binding
tsify = { version = "0.5" }

wasm-bindgen = { version = "0.2" }
wasm-bindgen-futures = { version = "0.4", optional = true }

[dev-dependencies]
wasm-bindgen-test = "0.3"
